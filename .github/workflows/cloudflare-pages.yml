name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: guowen-reading
    steps:
      - name: Check Cloudflare secrets
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::尚未設定 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，略過 Cloudflare Pages 部署。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - name: Create Pages project if missing
        if: steps.check.outputs.ready == 'true'
        run: |
          if npx --yes wrangler@4 pages project list | grep -qw "$PROJECT_NAME"; then
            echo "Project $PROJECT_NAME already exists."
          else
            npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch=main
          fi

      - name: Deploy docs/ to Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy docs --project-name="$PROJECT_NAME" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
